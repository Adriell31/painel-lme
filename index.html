<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Rerum · Cotações LME + Dólar</title>
<style>
  :root{--bg:#0c1a29;--bg2:#0a1623;--panel:#15293d;--panel2:#102234;--line:#26405a;
        --txt:#eef4fb;--muted:#9ab0cc;--red:#d4403a;--up:#3ad08a;--down:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:radial-gradient(1200px 600px at 80% -10%,#163149 0%,var(--bg) 45%,var(--bg2) 100%);color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:2.2vh 2.4vw;gap:1.5vh;}
  header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--red);padding-bottom:1.4vh;}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:.5vh;}
  .brand .title{font-size:2.7vh;font-weight:700;color:var(--txt);letter-spacing:.3px;}
  .brand .title .hl{color:var(--red);font-weight:800;}
  .brand img{height:7vh;width:auto;object-fit:contain;display:block;}
  .brand .sub{color:var(--muted);font-size:1.7vh;font-weight:500;letter-spacing:.3px;}
  .clock{text-align:right;}
  .clock .t{font-size:4vh;font-weight:800;}
  .clock .d{color:var(--muted);font-size:1.8vh;margin-top:.3vh;}
  .clock .d b{color:var(--red);}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vh 1.3vw;}
  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:1.5vh 1.3vw;display:flex;flex-direction:column;gap:.5vh;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red);opacity:.85;}
  .card .nm{font-size:2vh;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
  .card .val{font-size:4.1vh;font-weight:800;line-height:1;}
  .card .unit{font-size:1.6vh;color:var(--muted);}
  .card .delta{font-size:1.9vh;font-weight:700;}
  .card .brl{font-size:1.7vh;color:var(--muted);margin-top:.1vh;}
  .up{color:var(--up);} .down{color:var(--down);}
  .card.dolar{background:linear-gradient(160deg,#1c2f22,#122218);}
  .card.dolar::before{background:var(--up);}
  .charts{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.3vh 1.3vw;min-height:0;}
  .chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1vh 1vw;display:flex;flex-direction:column;}
  .chart .ct{font-size:1.7vh;color:var(--muted);font-weight:600;margin-bottom:.3vh;}
  .chart svg{width:100%;flex:1;}
  footer{color:var(--muted);font-size:1.5vh;text-align:center;padding-top:.5vh;}
  footer b{color:var(--red);}
</style>
</head>

const METAIS=[{k:"cobre",nm:"Cobre",unit:"US$/t",cor:"#e08a4a"},{k:"zinco",nm:"Zinco",unit:"US$/t",cor:"#9ab6d6"},{k:"aluminio",nm:"Alumínio",unit:"US$/t",cor:"#6fb6ff"},{k:"chumbo",nm:"Chumbo",unit:"US$/t",cor:"#b39ddb"},{k:"estanho",nm:"Estanho",unit:"US$/t",cor:"#f0c453"},{k:"niquel",nm:"Níquel",unit:"US$/t",cor:"#56cfc0"}];
const rows=DADOS.rows;
function lastNonNull(k){for(let i=rows.length-1;i>=0;i--){if(rows[i][k]!=null)return{v:rows[i][k],i:i};}return{v:null,i:-1};}
function prevNonNull(k,f){for(let i=f-1;i>=0;i--){if(rows[i][k]!=null)return rows[i][k];}return null;}
function fmt(v,d){return v==null?"—":v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
const dolar=lastNonNull("dolar").v;
let html="";
for(const m of METAIS){const cur=lastNonNull(m.k);const prev=prevNonNull(m.k,cur.i);let delta="",cls="";if(prev!=null&&cur.v!=null){const p=(cur.v-prev)/prev*100;cls=p>=0?"up":"down";delta=(p>=0?"▲ ":"▼ ")+fmt(Math.abs(p),2)+"%";}const brl=(cur.v!=null&&dolar!=null)?("R$ "+fmt(cur.v*dolar,2)+" /t"):"—";html+=`<div class="card"><div class="nm">${m.nm}</div><div class="val">${fmt(cur.v,2)}</div><div class="unit">${m.unit}</div><div class="delta ${cls}">${delta}</div><div class="brl">${brl}</div></div>`;}
{const cur=lastNonNull("dolar");const prev=prevNonNull("dolar",cur.i);let delta="",cls="";if(prev!=null&&cur.v!=null){const p=(cur.v-prev)/prev*100;cls=p>=0?"up":"down";delta=(p>=0?"▲ ":"▼ ")+fmt(Math.abs(p),2)+"%";}html+=`<div class="card dolar"><div class="nm">Dólar</div><div class="val">${fmt(cur.v,4)}</div><div class="unit">R$/US$</div><div class="delta ${cls}">${delta}</div><div class="brl">comercial (ref.)</div></div>`;}
document.getElementById("cards").innerHTML=html;
function spark(key,cor){const valid=rows.map(r=>r[key]);const idx=valid.map((v,i)=>v==null?null:i).filter(i=>i!=null);const vals=idx.map(i=>valid[i]);if(vals.length<2)return"";const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,W=300,H=120,pad=8;const pts=[];idx.forEach((i,j)=>{const x=pad+(W-2*pad)*(j/(idx.length-1));const y=H-pad-(H-2*pad)*((valid[i]-min)/rng);pts.push(x.toFixed(1)+","+y.toFixed(1));});const d="M"+pts.join(" L");const area="M"+pts[0].split(",")[0]+","+(H-pad)+" L"+pts.join(" L")+" L"+pts[pts.length-1].split(",")[0]+","+(H-pad)+" Z";return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${area}" fill="${cor}22"/><path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5"/></svg>`;}
let ch="";for(const m of METAIS){ch+=`<div class="chart"><div class="ct">${m.nm} — mês</div>${spark(m.k,m.cor)}</div>`;}
